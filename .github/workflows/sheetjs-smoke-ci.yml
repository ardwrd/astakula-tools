name: SheetJS Integration Smoke
on:
  push:
    branches: [main]
    paths:
      - "excel/**"
      - "certificate/**"
      - "schedule/**"
      - "security/**"
      - ".github/workflows/sheetjs-smoke-ci.yml"
  pull_request:
    paths:
      - "excel/**"
      - "certificate/**"
      - "schedule/**"
      - "security/**"
      - ".github/workflows/sheetjs-smoke-ci.yml"
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test security/tests/sheetjs-integration.test.mjs
