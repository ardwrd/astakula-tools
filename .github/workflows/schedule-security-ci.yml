name: Schedule HTML Safety
on:
  push:
    branches: [main]
    paths:
      - "schedule/**"
      - ".github/workflows/schedule-security-ci.yml"
  pull_request:
    paths:
      - "schedule/**"
      - ".github/workflows/schedule-security-ci.yml"
permissions:
  contents: read
jobs:
  security-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check schedule/app.js
      - run: node --test schedule/tests/*.test.mjs
