name: Network Tools Validation
on:
  push:
    branches: [main]
    paths:
      - "network/**"
      - ".github/workflows/network-validation-ci.yml"
  pull_request:
    paths:
      - "network/**"
      - ".github/workflows/network-validation-ci.yml"
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check network/js/app.js
      - run: node --test network/tests/*.test.mjs
