name: UUID Generator Validation
on:
  push:
    branches: [main]
    paths: ["uuid/**", ".github/workflows/uuid-validation-ci.yml"]
  pull_request:
    paths: ["uuid/**", ".github/workflows/uuid-validation-ci.yml"]
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check uuid/js/app.js
      - run: node --test uuid/tests/*.test.mjs
