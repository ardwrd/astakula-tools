name: GitHub Inspector Validation
on:
  push:
    branches: [main]
    paths: ["github/**", ".github/workflows/github-inspector-ci.yml"]
  pull_request:
    paths: ["github/**", ".github/workflows/github-inspector-ci.yml"]
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check github/app.js
      - run: node --test github/tests/*.test.mjs
