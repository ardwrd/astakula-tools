name: JSON Formatter Validation
on:
  push:
    branches: [main]
    paths: ["json/**", ".github/workflows/json-validation-ci.yml"]
  pull_request:
    paths: ["json/**", ".github/workflows/json-validation-ci.yml"]
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check json/js/app.js
      - run: node --test json/tests/*.test.mjs
